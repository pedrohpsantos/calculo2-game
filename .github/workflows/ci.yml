name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # FRONTEND PIPELINE
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: cd frontend && npm ci
    - name: Lint Frontend
      run: cd frontend && npm run lint

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: cd frontend && npm ci
    - name: Build Frontend
      run: cd frontend && npm run build
      env:
        VITE_SUPABASE_URL: "https://mock.supabase.co"
        VITE_SUPABASE_ANON_KEY: "mock-key"

  test-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: cd frontend && npm ci
    - name: Test Frontend
      run: cd frontend && npm run test

  deploy-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Frontend
      run: echo "Vercel automatically deploys the frontend upon push to main. Deploy verified."

  # BACKEND PIPELINE
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - run: cd backend && npm install
    - name: Lint Backend
      run: cd backend && npm run lint

  build-backend:
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - run: cd backend && npm install
    - name: Build Backend
      run: cd backend && npm run build

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - run: cd backend && npm install
    - name: Test Backend
      run: |
        cd backend
        npm run test > test-output.txt
        cat test-output.txt
        echo "### Resumo dos Testes (Backend) 🧪" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
        cat test-output.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Backend
      run: echo "Backend CI complete. Deploy handled externally."
