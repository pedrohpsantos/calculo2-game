name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # FRONTEND PIPELINE
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - name: Lint Frontend
      run: npm run lint

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - name: Build Frontend
      run: npm run build
      env:
        VITE_SUPABASE_URL: "https://mock.supabase.co"
        VITE_SUPABASE_ANON_KEY: "mock-key"

  test-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - run: npm ci
    - name: Test Frontend
      run: npm run test

  deploy-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Frontend
      run: echo "Vercel automatically deploys the frontend upon push to main. Deploy verified."

  # BACKEND PIPELINE (Mock/Supabase)
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Lint Backend
      run: echo "Backend is managed via Supabase (BaaS). No local backend to lint."

  build-backend:
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
    - name: Build Backend
      run: echo "Backend is managed via Supabase (BaaS). No local backend to build."

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
    - name: Test Backend
      run: echo "Backend is managed via Supabase (BaaS). Backend testing handled externally."

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Backend
      run: echo "Backend is managed via Supabase (BaaS). Deploy verified."
